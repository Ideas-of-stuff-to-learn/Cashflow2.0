<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palette Mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ── Tool chrome ───────────────────────────────────────────────────────── */
:root {
  --bg:      #f4f4f2; --surface: #ffffff; --surface2: #efefed;
  --border:  #e0e0db; --text:    #1a1a1a; --text2:    #777;
  --accent:  #2E5C8A; --success: #3D8B5F; --danger:   #C0392B;
  --mono: 'JetBrains Mono','Fira Mono',monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161616;--surface:#202020;--surface2:#2a2a2a;--border:#333;
  --text:#e8e8e8;--text2:#888;--accent:#4a85be;
}}
:root[data-theme="dark"]{
  --bg:#161616;--surface:#202020;--surface2:#2a2a2a;--border:#333;
  --text:#e8e8e8;--text2:#888;--accent:#4a85be;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter Tight',system-ui,sans-serif;font-size:14px;
  background:var(--bg);color:var(--text);
  padding:0 0 60px;
}

/* ── Save bar ──────────────────────────────────────────────────────────── */
#saveBar{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:12px;
  background:#1a2d3e;color:#e8f0f8;
  padding:10px 20px;border-bottom:2px solid #2E5C8A;
  transform:translateY(-100%);transition:transform .2s ease;
}
#saveBar.visible{transform:translateY(0)}
#saveBar .change-label{flex:1;font-size:13px;font-weight:500}
#saveBar .btn-save{
  background:#2E5C8A;color:#fff;border:none;border-radius:6px;
  padding:7px 18px;font-size:13px;font-weight:700;cursor:pointer;
}
#saveBar .btn-save:hover{background:#245075}
#saveBar .btn-discard{
  background:transparent;color:#aac;border:1px solid #446;
  border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;
}
#saveBar .file-badge{
  font-size:11px;color:#7a9;background:rgba(61,139,95,.15);
  border:1px solid rgba(61,139,95,.3);border-radius:4px;padding:2px 8px;
}

/* ── Page layout ───────────────────────────────────────────────────────── */
.page-header{padding:20px 20px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.page-header h1{font-family:'Inter',system-ui,sans-serif;font-weight:700;font-size:18px}
.page-header .sub{font-size:12px;color:var(--text2)}
.main-cols{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 60px)}
@media(max-width:900px){.main-cols{grid-template-columns:1fr;}}

/* ── Left panel ────────────────────────────────────────────────────────── */
.left-panel{border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 40px);position:sticky;top:40px}
.load-strip{
  display:flex;align-items:center;gap:8px;padding:12px 16px;
  border-bottom:1px solid var(--border);background:var(--surface2);
}
.btn-load{
  background:var(--accent);color:#fff;border:none;border-radius:6px;
  padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.btn-load:hover{opacity:.85}
.file-name{font-size:11px;color:var(--text2);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* Section tabs */
.sec-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface)}
.sec-tab{
  flex:1;padding:9px 4px;font-size:11px;font-weight:600;text-align:center;
  border:none;background:transparent;color:var(--text2);cursor:pointer;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
}
.sec-tab:hover{color:var(--text)}
.sec-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sec-tab .dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:transparent;margin-left:4px;vertical-align:middle;
  transition:background .15s;
}
.sec-tab.dirty .dot{background:#E07A3E}

/* Token rows */
.sec-body{padding:6px 0}
.token-row{
  display:flex;align-items:center;gap:8px;
  padding:5px 14px;border-bottom:1px solid var(--border);
  transition:background .1s;
}
.token-row:hover{background:var(--surface2)}
.token-row.modified{background:rgba(224,122,62,.07)}
.token-key{font-family:var(--mono);font-size:10px;color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.token-row.modified .token-key{color:#C4722A;font-weight:600}
.token-val-color{display:flex;align-items:center;gap:5px}
input[type="color"]{width:28px;height:26px;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:1px;background:none}
input.hex-input{
  font-family:var(--mono);font-size:11px;width:72px;
  border:1px solid var(--border);border-radius:4px;
  padding:4px 6px;background:var(--surface2);color:var(--text);outline:none;
}
input.hex-input:focus{border-color:var(--accent)}
input.str-input{
  font-size:11px;flex:1;min-width:80px;
  border:1px solid var(--border);border-radius:4px;
  padding:4px 7px;background:var(--surface2);color:var(--text);outline:none;
}
input.str-input:focus{border-color:var(--accent)}
.reset-dot{
  width:14px;height:14px;border-radius:50%;cursor:pointer;
  background:#E07A3E;border:none;flex-shrink:0;
  display:none;transition:transform .15s;
}
.reset-dot:hover{transform:scale(1.2)}
.token-row.modified .reset-dot{display:block}

/* Paste section */
.paste-panel{border-top:1px solid var(--border)}
.paste-toggle{
  width:100%;text-align:left;padding:9px 14px;background:var(--surface2);
  border:none;border-bottom:1px solid var(--border);font-size:12px;
  color:var(--text2);cursor:pointer;
}
.paste-toggle:hover{color:var(--text)}
.paste-body{padding:10px 14px;display:none}
.paste-body.open{display:block}
textarea.paste-area{
  width:100%;min-height:110px;resize:vertical;font-family:var(--mono);
  font-size:11px;line-height:1.5;background:var(--surface2);color:var(--text);
  border:1px solid var(--border);border-radius:6px;padding:10px;outline:none;
}
textarea.paste-area:focus{border-color:var(--accent)}
.parse-status{font-size:11px;margin-top:6px;color:var(--text2);min-height:16px}
.parse-status.ok{color:var(--success)}
.parse-status.err{color:var(--danger)}

/* ── Right panel ───────────────────────────────────────────────────────── */
.right-panel{display:flex;flex-direction:column;height:100%;overflow:hidden}
.prev-tabs{
  display:flex;border-bottom:1px solid var(--border);
  background:var(--surface);flex-shrink:0;
}
.prev-tab{
  padding:10px 18px;font-size:12px;font-weight:600;
  border:none;background:transparent;color:var(--text2);cursor:pointer;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
}
.prev-tab:hover{color:var(--text)}
.prev-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.prev-content{flex:1;padding:12px;overflow:hidden;background:var(--bg)}
.prev-pane{height:100%;overflow:hidden}
.mock{height:100%;display:flex;flex-direction:column;overflow:hidden}
.mock-body{flex:1;overflow:hidden}
.mock-main{flex:1;overflow:hidden}

/* ── Preview shells ────────────────────────────────────────────────────── */
.mock{border-radius:10px;overflow:hidden;border:1px solid var(--border);font-size:13px;box-shadow:0 2px 12px rgba(0,0,0,.08)}

/* Dashboard mock */
.mock-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-weight:600;font-size:13px;border-bottom:1px solid}
.mock-pill{font-size:10px;font-weight:700;border-radius:20px;padding:3px 10px}
.mock-body{display:flex;min-height:220px}
.mock-sidebar{width:130px;flex-shrink:0;padding:10px;border-right:1px solid}
.mock-nav-item{padding:6px 8px;border-radius:5px;margin-bottom:2px;font-size:11px;cursor:default}
.mock-main{flex:1;padding:12px 14px}
.mock-cards{display:flex;gap:8px;margin-bottom:10px}
.mock-card{flex:1;border-radius:6px;padding:10px 12px;border:1px solid}
.mock-card .mct{font-size:10px;color:#999;margin-bottom:3px}
.mock-card .mcv{font-size:22px;font-weight:700}
.mock-trow{display:flex;border-bottom:1px solid;padding:5px 0;font-size:11px}
.mock-trow span{flex:1}
.mock-trow .ma{text-align:right;font-weight:500}
.mock-btns{display:flex;gap:8px;margin-top:10px}
.mock-btn{padding:6px 14px;border-radius:5px;font-size:11px;font-weight:600}
.mock-input{border:1px solid;border-radius:5px;padding:5px 9px;font-size:11px;width:100%;margin-top:8px;outline:none}

/* Charts mock */
.mock-chart-area{padding:16px}
.chart-title{font-family:'Inter',system-ui,sans-serif;font-weight:700;font-size:14px;margin-bottom:12px}
.stacked-chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-bottom:24px;position:relative}
.stacked-col{display:flex;flex-direction:column-reverse;flex:1;height:100%;gap:1px}
.stacked-col-wrap{display:flex;flex-direction:column;align-items:center;flex:1}
.stacked-bar-seg{width:100%;border-radius:0}
.stacked-bar-seg:last-child{border-radius:3px 3px 0 0}
.col-label{font-size:9px;margin-top:4px;text-align:center}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* Login mock */
.mock-login{display:flex;align-items:center;justify-content:center;min-height:240px;padding:24px}
.login-card{width:100%;max-width:300px;border-radius:10px;padding:24px;border:1px solid;text-align:center}
.login-logo{font-size:11px;font-weight:700;margin-bottom:16px;letter-spacing:.05em}
.login-title{font-family:'Inter',system-ui,sans-serif;font-weight:700;font-size:15px;margin-bottom:4px}
.login-sub{font-size:11px;color:#888;margin-bottom:16px}
.login-input{
  width:100%;border:1px solid;border-radius:6px;
  padding:8px 10px;font-size:12px;margin-bottom:8px;outline:none;
  background:transparent;color:inherit;
}
.login-btn{
  width:100%;border:none;border-radius:6px;
  padding:9px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;
}
</style>
</head>
<body>

<!-- ── Sticky save bar ──────────────────────────────────────────────────── -->
<div id="saveBar">
  <span class="change-label" id="changeLabel">0 changes</span>
  <span class="file-badge" id="fileBadge" hidden></span>
  <button class="btn-discard" onclick="discardAll()">Discard</button>
  <button class="btn-save" onclick="saveToFile()">Save to theme.css</button>
</div>

<!-- ── Page header ─────────────────────────────────────────────────────── -->
<div class="page-header">
  <h1>Palette Mapper</h1>
  <span class="sub">Edit tokens → preview updates live → save writes directly to theme.css</span>
</div>

<!-- ── Two-column layout ────────────────────────────────────────────────── -->
<div class="main-cols">

  <!-- LEFT: token editor -->
  <div class="left-panel">

    <!-- Load file strip -->
    <div class="load-strip">
      <button class="btn-load" onclick="loadFile()">Open theme.css</button>
      <span class="file-name" id="loadedFileName">No file loaded — or paste CSS below</span>
    </div>

    <!-- Section tabs -->
    <div class="sec-tabs" id="secTabs"></div>
    <div id="secBody" class="sec-body"></div>

    <!-- Paste override -->
    <div class="paste-panel">
      <button class="paste-toggle" onclick="togglePaste(this)">▾ Paste CSS from realtimecolors / other tool</button>
      <div class="paste-body open" id="pasteBody">
        <textarea class="paste-area" id="pasteArea" placeholder="Paste exported CSS — @import, body {}, h1-h5 {}, :root { --var: value } …&#10;Values override the token editor above."></textarea>
        <div class="parse-status" id="parseStatus">Paste CSS here — preview updates instantly</div>
      </div>
    </div>

  </div>

  <!-- RIGHT: preview -->
  <div class="right-panel">
    <div class="prev-tabs" id="prevTabs">
      <button class="prev-tab active" onclick="switchPreview('dashboard',this)">Dashboard</button>
      <button class="prev-tab" onclick="switchPreview('charts',this)">Charts</button>
      <button class="prev-tab" onclick="switchPreview('login',this)">Login</button>
      <button class="prev-tab" onclick="switchPreview('upload',this)">Upload</button>
      <button class="prev-tab" onclick="switchPreview('review',this)">Review</button>
      <button class="prev-tab" onclick="switchPreview('modals',this)">Modals</button>
      <button class="prev-tab" onclick="switchPreview('states',this)">States</button>
    </div>
    <div class="prev-content">
      <div id="prev-dashboard" class="prev-pane"></div>
      <div id="prev-charts"    class="prev-pane" hidden></div>
      <div id="prev-login"     class="prev-pane" hidden></div>
      <div id="prev-upload"    class="prev-pane" hidden></div>
      <div id="prev-review"    class="prev-pane" hidden></div>
      <div id="prev-modals"    class="prev-pane" hidden></div>
      <div id="prev-states"    class="prev-pane" hidden></div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// SCHEMA — all editable tokens grouped by section
// ═══════════════════════════════════════════════════════════════════════════
const SECTIONS = [
  { id:'typography', label:'Type', tokens:[
    { key:'--font-body',          type:'str',   label:'Body font',      default:"'Inter Tight', system-ui, -apple-system, sans-serif" },
    { key:'--font-heading',       type:'str',   label:'Heading font',   default:"'Inter', system-ui, -apple-system, sans-serif" },
    { key:'--font-size-base',     type:'str',   label:'Base size',      default:'1rem' },
    { key:'--font-size-h1',       type:'str',   label:'h1',             default:'1.802rem' },
    { key:'--font-size-h2',       type:'str',   label:'h2',             default:'1.602rem' },
    { key:'--font-size-h3',       type:'str',   label:'h3',             default:'1.424rem' },
    { key:'--font-size-h4',       type:'str',   label:'h4',             default:'1.266rem' },
    { key:'--font-size-h5',       type:'str',   label:'h5',             default:'1.125rem' },
    { key:'--font-size-sm',       type:'str',   label:'Small',          default:'0.889rem' },
    { key:'--font-size-xs',       type:'str',   label:'XS',             default:'0.75rem' },
    { key:'--font-weight-normal', type:'str',   label:'Weight normal',  default:'400' },
    { key:'--font-weight-medium', type:'str',   label:'Weight medium',  default:'500' },
    { key:'--font-weight-bold',   type:'str',   label:'Weight bold',    default:'700' },
    { key:'--line-height',        type:'str',   label:'Line height',    default:'1.5' },
  ]},
  { id:'brand', label:'Brand', tokens:[
    { key:'--primary',         type:'color', label:'Primary',          default:'#2E5C8A' },
    { key:'--primary-hover',   type:'color', label:'Primary hover',    default:'#245075' },
    { key:'--primary-light',   type:'color', label:'Primary light',    default:'#ebf1f8' },
    { key:'--primary-lighter', type:'color', label:'Primary lighter',  default:'#dde9f5' },
    { key:'--primary-muted',   type:'color', label:'Primary muted',    default:'#c5d9ee' },
    { key:'--danger',          type:'color', label:'Danger',           default:'#D94F4F' },
    { key:'--danger-hover',    type:'color', label:'Danger hover',     default:'#b83c3c' },
    { key:'--success',         type:'color', label:'Success',          default:'#3D8B5F' },
    { key:'--success-bright',  type:'color', label:'Success bright',   default:'#27AE60' },
    { key:'--gold',            type:'color', label:'Gold',             default:'#C4A227' },
    { key:'--brown',           type:'color', label:'Brown',            default:'#7A5C3D' },
  ]},
  { id:'backgrounds', label:'Bg', tokens:[
    { key:'--bg-page',       type:'color', label:'Page bg',       default:'#ffffff' },
    { key:'--bg-surface',    type:'color', label:'Surface',        default:'#F8F9FA' },
    { key:'--bg-subtle',     type:'color', label:'Subtle',         default:'#fafafa' },
    { key:'--bg-input',      type:'color', label:'Input',          default:'#f7f7f7' },
    { key:'--bg-header-row', type:'color', label:'Header row',     default:'#F0F4F8' },
    { key:'--bg-muted',      type:'color', label:'Muted',          default:'#f5f5f5' },
    { key:'--bg-highlight',  type:'color', label:'Highlight',      default:'#FDEBD8' },
    { key:'--bg-warning',    type:'color', label:'Warning',        default:'#FFF3CD' },
    { key:'--bg-error',      type:'color', label:'Error',          default:'#FDECEA' },
    { key:'--bg-selected',   type:'color', label:'Selected',       default:'#DCE8F5' },
  ]},
  { id:'text', label:'Text', tokens:[
    { key:'--text-primary',   type:'color', label:'Primary',   default:'#1a1a1a' },
    { key:'--text-secondary', type:'color', label:'Secondary', default:'#555555' },
    { key:'--text-muted',     type:'color', label:'Muted',     default:'#888888' },
    { key:'--text-faint',     type:'color', label:'Faint',     default:'#bbbbbb' },
  ]},
  { id:'borders', label:'Borders', tokens:[
    { key:'--border',        type:'color', label:'Light',    default:'#eeeeee' },
    { key:'--border-medium', type:'color', label:'Medium',   default:'#dddddd' },
    { key:'--border-strong', type:'color', label:'Strong',   default:'#cccccc' },
    { key:'--border-table',  type:'color', label:'Table',    default:'#e0e6ed' },
  ]},
];

// Category colours derived from palette tokens so they update live with the palette
function chartColors() {
  return [
    get('--primary'),
    get('--gold')          || '#C4A227',
    get('--success')       || '#3D8B5F',
    get('--danger')        || '#D94F4F',
    get('--success-bright')|| '#27AE60',
    get('--brown')         || '#7A5C3D',
    get('--primary-hover') || '#245075',
    get('--primary-muted') || '#c5d9ee',
  ];
}
// Static fallback used only before any tokens are loaded
const CHART_COLORS = ['#2E5C8A','#C4A227','#3D8B5F','#D94F4F','#27AE60','#7A5C3D','#245075','#c5d9ee'];
const CATS = ['Groceries','Transport','Dining','Utilities','Entertainment','Shopping'];

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
const original = {};  // token key → value as loaded from file / default
const current  = {};  // token key → current edited value
let fileHandle = null;
let fileOriginalText = null;
let activeSec = 'typography';
let activePrev = 'dashboard';

// Init from defaults
SECTIONS.forEach(s => s.tokens.forEach(t => {
  original[t.key] = t.default;
  current[t.key]  = t.default;
}));

// ═══════════════════════════════════════════════════════════════════════════
// BUILD SECTION TABS + ROWS
// ═══════════════════════════════════════════════════════════════════════════
function buildTabs() {
  const tabs = document.getElementById('secTabs');
  tabs.innerHTML = '';
  SECTIONS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'sec-tab' + (s.id === activeSec ? ' active' : '');
    btn.dataset.sec = s.id;
    btn.innerHTML = `${s.label}<span class="dot"></span>`;
    btn.onclick = () => { activeSec = s.id; buildTabs(); buildRows(); };
    tabs.appendChild(btn);
  });
  // Mark dirty tabs
  SECTIONS.forEach(s => {
    const dirty = s.tokens.some(t => current[t.key] !== original[t.key]);
    if (dirty) tabs.querySelector(`[data-sec="${s.id}"]`).classList.add('dirty');
  });
}

function buildRows() {
  const body = document.getElementById('secBody');
  body.innerHTML = '';
  const sec = SECTIONS.find(s => s.id === activeSec);
  if (!sec) return;
  sec.tokens.forEach(t => {
    const isModified = current[t.key] !== original[t.key];
    const row = document.createElement('div');
    row.className = 'token-row' + (isModified ? ' modified' : '');
    row.dataset.key = t.key;

    if (t.type === 'color') {
      const safeColor = isValidHex(current[t.key]) ? current[t.key] : '#888888';
      row.innerHTML = `
        <span class="token-key" title="${t.key}">${t.label}</span>
        <div class="token-val-color">
          <input type="color" id="col_${cssId(t.key)}" value="${safeColor}" />
          <input type="text" class="hex-input" id="txt_${cssId(t.key)}" value="${current[t.key]}" maxlength="9" spellcheck="false" />
        </div>
        <button class="reset-dot" title="Reset to original" onclick="resetToken('${t.key}')"></button>`;
      row.querySelector(`#col_${cssId(t.key)}`).addEventListener('input', e => {
        const v = e.target.value;
        row.querySelector(`#txt_${cssId(t.key)}`).value = v;
        setToken(t.key, v);
      });
      row.querySelector(`#txt_${cssId(t.key)}`).addEventListener('input', e => {
        const v = e.target.value.trim();
        if (isValidHex(v)) { row.querySelector(`#col_${cssId(t.key)}`).value = v; setToken(t.key, v); }
      });
      row.querySelector(`#txt_${cssId(t.key)}`).addEventListener('blur', e => {
        if (!isValidHex(e.target.value.trim())) e.target.value = current[t.key];
      });
    } else {
      row.innerHTML = `
        <span class="token-key" title="${t.key}">${t.label}</span>
        <input type="text" class="str-input" id="str_${cssId(t.key)}" value="${current[t.key]}" />
        <button class="reset-dot" title="Reset to original" onclick="resetToken('${t.key}')"></button>`;
      row.querySelector(`#str_${cssId(t.key)}`).addEventListener('input', e => setToken(t.key, e.target.value));
    }
    body.appendChild(row);
  });
}

function cssId(key) { return key.replace(/[^a-zA-Z0-9]/g, '_'); }
function isValidHex(v) { return /^#[0-9a-fA-F]{3,8}$/.test(v); }

// ═══════════════════════════════════════════════════════════════════════════
// TOKEN MUTATIONS
// ═══════════════════════════════════════════════════════════════════════════
function setToken(key, value) {
  current[key] = value;
  updateSaveBar();
  buildTabs();
  refreshRow(key);
  updatePreviews();
  injectPreviewTokens();
}

function resetToken(key) {
  current[key] = original[key];
  updateSaveBar();
  buildTabs();
  buildRows();
  updatePreviews();
  injectPreviewTokens();
}

function discardAll() {
  SECTIONS.forEach(s => s.tokens.forEach(t => { current[t.key] = original[t.key]; }));
  updateSaveBar();
  buildTabs();
  buildRows();
  updatePreviews();
  injectPreviewTokens();
}

function refreshRow(key) {
  const row = document.querySelector(`.token-row[data-key="${key}"]`);
  if (!row) return;
  const isModified = current[key] !== original[key];
  row.classList.toggle('modified', isModified);
}

// ═══════════════════════════════════════════════════════════════════════════
// SAVE BAR
// ═══════════════════════════════════════════════════════════════════════════
function countChanges() {
  return SECTIONS.reduce((n, s) => n + s.tokens.filter(t => current[t.key] !== original[t.key]).length, 0);
}
function updateSaveBar() {
  const n = countChanges();
  const bar = document.getElementById('saveBar');
  bar.classList.toggle('visible', n > 0);
  document.getElementById('changeLabel').textContent = `${n} unsaved change${n !== 1 ? 's' : ''}`;
}

// ═══════════════════════════════════════════════════════════════════════════
// FILE SYSTEM ACCESS
// ═══════════════════════════════════════════════════════════════════════════
async function loadFile() {
  if (!('showOpenFilePicker' in window)) {
    alert('File System Access API requires Chrome or Edge.');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'CSS', accept: { 'text/css': ['.css'] } }],
    });
    fileHandle = handle;
    const file = await handle.getFile();
    fileOriginalText = await file.text();
    document.getElementById('loadedFileName').textContent = handle.name;
    document.getElementById('fileBadge').textContent = handle.name;
    document.getElementById('fileBadge').hidden = false;
    parseFileIntoTokens(fileOriginalText);
  } catch(e) {
    if (e.name !== 'AbortError') alert('Could not open file: ' + e.message);
  }
}

function parseFileIntoTokens(css) {
  // Extract all CSS custom property values from :root {}
  const rootMatch = css.match(/:root\s*\{([^}]*)\}/s);
  if (!rootMatch) return;
  const rootBlock = rootMatch[1];
  const re = /(--[\w-]+)\s*:\s*([^;]+);/g;
  let m;
  while ((m = re.exec(rootBlock)) !== null) {
    const key = m[1].trim(), val = m[2].trim();
    if (key in original) {
      original[key] = val;
      current[key]  = val;
    }
  }
  buildTabs();
  buildRows();
  updatePreviews();
  injectPreviewTokens();
  updateSaveBar();
}

async function saveToFile() {
  if (!fileHandle) {
    if (!('showOpenFilePicker' in window)) { alert('Chrome or Edge required for file write.'); return; }
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'CSS', accept: { 'text/css': ['.css'] } }],
      });
      fileHandle = handle;
      const file = await handle.getFile();
      fileOriginalText = await file.text();
      document.getElementById('loadedFileName').textContent = handle.name;
      document.getElementById('fileBadge').textContent = handle.name;
      document.getElementById('fileBadge').hidden = false;
      parseFileIntoTokens(fileOriginalText);
    } catch(e) {
      if (e.name !== 'AbortError') alert('Could not open file: ' + e.message);
      return;
    }
  }

  // Re-read latest file content (may have changed externally)
  const freshFile = await fileHandle.getFile();
  let css = await freshFile.text();

  // In-place token substitution — replaces each changed token value exactly
  SECTIONS.forEach(s => s.tokens.forEach(t => {
    if (current[t.key] === original[t.key]) return;
    const escaped = t.key.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
    const re = new RegExp(`(${escaped}\\s*:)([^;]*)(;)`, 'g');
    css = css.replace(re, `$1 ${current[t.key]}$3`);
  }));

  try {
    const writable = await fileHandle.createWritable();
    await writable.write(css);
    await writable.close();
    // Saved — promote current to original
    SECTIONS.forEach(s => s.tokens.forEach(t => { original[t.key] = current[t.key]; }));
    fileOriginalText = css;
    updateSaveBar();
    buildTabs();
    buildRows();
    // Flash confirmation
    const bar = document.getElementById('saveBar');
    bar.style.background = '#1a3d2a';
    setTimeout(() => { bar.style.background = ''; }, 1200);
  } catch(e) {
    alert('Write failed: ' + e.message);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// CSS PASTE PARSER
// ═══════════════════════════════════════════════════════════════════════════
function togglePaste(btn) {
  const body = document.getElementById('pasteBody');
  const open = body.classList.toggle('open');
  btn.textContent = (open ? '▾' : '▸') + ' Paste CSS from realtimecolors / other tool';
}

function flashPreview() {
  const content = document.querySelector('.prev-content');
  if (!content) return;
  content.style.transition = 'opacity 0.08s';
  content.style.opacity = '0.4';
  setTimeout(() => { content.style.opacity = '1'; }, 80);
}

document.addEventListener('DOMContentLoaded', () => {
  function handlePasteInput() {
    const raw = document.getElementById('pasteArea').value.trim();
    const status = document.getElementById('parseStatus');
    if (!raw) { status.className='parse-status'; status.textContent='Waiting…'; return; }

    const css = raw.replace(/\/\*[\s\S]*?\*\//g, '');
    let found = 0;

    // Google Fonts import → inject for preview
    const imp = raw.match(/@import\s+url\(['"]?([^'")\s]+)['"]?\)/);
    if (imp) injectFont(imp[1]);

    // :root custom properties
    const rootM = css.match(/:root\s*\{([^}]*)\}/s);
    if (rootM) {
      const re = /(--[\w-]+)\s*:\s*([^;]+);/g; let m;
      while ((m = re.exec(rootM[1])) !== null) {
        const key=m[1].trim(), val=m[2].trim();
        if (key in current) { setToken(key, val); found++; }
      }
    }

    // body font-family / font-weight
    const bodyM = css.match(/body\s*\{([^}]*)\}/s);
    if (bodyM) {
      const ff = bodyM[1].match(/font-family\s*:\s*([^;]+)/);
      const fw = bodyM[1].match(/font-weight\s*:\s*([^;]+)/);
      if (ff) { setToken('--font-body', ff[1].trim()); found++; }
      if (fw) { setToken('--font-weight-normal', fw[1].trim()); found++; }
    }

    // html font-size
    const htmlM = css.match(/html\s*\{([^}]*)\}/s);
    if (htmlM) {
      const fs = htmlM[1].match(/font-size\s*:\s*([^;]+)/);
      if (fs) { setToken('--font-size-base', fs[1].trim()); found++; }
    }

    // heading font-family / font-weight
    const headM = css.match(/h[1-5][^{]*\{([^}]*)\}/s);
    if (headM) {
      const ff = headM[1].match(/font-family\s*:\s*([^;]+)/);
      const fw = headM[1].match(/font-weight\s*:\s*([^;]+)/);
      if (ff) { setToken('--font-heading', ff[1].trim()); found++; }
      if (fw) { setToken('--font-weight-bold', fw[1].trim()); found++; }
    }

    // individual h sizes
    ['h1','h2','h3','h4','h5'].forEach(h => {
      const re2 = new RegExp(`\\b${h}\\s*\\{([^}]*)\\}`, 's');
      const m2 = css.match(re2);
      if (m2) {
        const fs2 = m2[1].match(/font-size\s*:\s*([^;]+)/);
        if (fs2) { setToken(`--font-size-${h}`, fs2[1].trim()); found++; }
      }
    });

    // small
    const smallM = css.match(/small\s*\{([^}]*)\}/s);
    if (smallM) {
      const fs = smallM[1].match(/font-size\s*:\s*([^;]+)/);
      if (fs) { setToken('--font-size-sm', fs[1].trim()); found++; }
    }

    status.className = found > 0 ? 'parse-status ok' : 'parse-status err';
    status.textContent = found > 0 ? `✓ ${found} value${found>1?'s':''} applied` : '⚠ No recognisable values found';

    buildRows();
    updatePreviews();
    injectPreviewTokens();
    if (found > 0) flashPreview();
  }

  const area = document.getElementById('pasteArea');
  area.addEventListener('input', handlePasteInput);
  // 'paste' fires before 'input' on some browsers; use a small delay so the value is committed
  area.addEventListener('paste', () => setTimeout(handlePasteInput, 0));
});

let injectedFont = '';
function injectFont(url) {
  if (url === injectedFont) return;
  const old = document.getElementById('_injFont');
  if (old) old.remove();
  const lnk = document.createElement('link');
  lnk.id = '_injFont'; lnk.rel = 'stylesheet';
  lnk.href = url.includes('display=') ? url : url + '&display=swap';
  document.head.appendChild(lnk);
  injectedFont = url;
}

// ═══════════════════════════════════════════════════════════════════════════
// INJECT TOKENS INTO PAGE (so previews use CSS vars)
// ═══════════════════════════════════════════════════════════════════════════
function injectPreviewTokens() {
  let el = document.getElementById('_previewVars');
  if (!el) { el = document.createElement('style'); el.id = '_previewVars'; document.head.appendChild(el); }
  const lines = SECTIONS.flatMap(s => s.tokens.map(t => `  ${t.key}: ${current[t.key]};`));
  el.textContent = `.mock { ${lines.join('\n')} }`;
}

// ── Charts (stacked bar) ───────────────────────────────────────────────────
function renderCharts() {
  const bodyF = get('--font-body');
  const headF = get('--font-heading');
  const hw    = get('--font-weight-bold');

  const MONTHS = ['Apr','May','Jun','Jul','Aug','Sep'];
  const DATA = [
    [320,180,95,210,140,85],
    [280,220,110,190,160,70],
    [360,160,130,240,120,90],
    [300,200,90,170,180,110],
    [340,190,120,230,150,80],
    [380,170,140,250,130,95],
  ];
  const maxTotal = Math.max(...DATA.map(m => m.reduce((a,b)=>a+b,0)));
  const CHART_H = 140;
  const BAR_W = 38; // px — thin bars like the real app

  const CC = chartColors();
  const bars = MONTHS.map((mo, mi) => {
    let bottomPx = 0;
    const segs = DATA[mi].map((val, ci) => {
      const segH = Math.max(2, Math.round((val / maxTotal) * CHART_H));
      const seg = `<div style="position:absolute;left:0;right:0;bottom:${bottomPx}px;height:${segH}px;background:${CC[ci]};${ci===DATA[mi].length-1?'border-radius:2px 2px 0 0':''}"></div>`;
      bottomPx += segH;
      return seg;
    }).join('');
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:0">
      <div style="position:relative;width:${BAR_W}px;height:${CHART_H}px">${segs}</div>
      <div style="font-size:9px;margin-top:5px;color:${get('--text-muted')};font-family:${bodyF};white-space:nowrap">${mo}</div>
