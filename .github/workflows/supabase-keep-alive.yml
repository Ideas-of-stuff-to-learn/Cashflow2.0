# .github/workflows/supabase-keep-alive.yml
#
# Pings the Supabase project every few days to reset its inactivity
# timer, preventing the free tier's 7-day auto-pause.
#
# NOTE: hitting the bare /rest/v1/ root does NOT reliably count as
# activity - Supabase's own docs specifically describe pausing as
# based on "user database activity" / "user queries", and a plain
# API-gateway response with no real table read behind it may not
# register at all. This queries an ACTUAL table (categories - small,
# stable, always has rows) so a genuine database read happens every
# time.
#
# IMPORTANT: this is a widely used, generally reliable workaround, but
# it is NOT an officially guaranteed Supabase feature - treat it as a
# strong mitigation to run ALONGSIDE the separate backup workflow
# (supabase-backup.yml), not as an absolute guarantee pausing can never
# happen.
#
# SETUP REQUIRED before this will work:
# 1. Add a repository secret named SUPABASE_URL - your project's API
#    URL, found in the Supabase dashboard under Project Settings -> API
#    (looks like https://xxxxx.supabase.co).
# 2. Add a repository secret named SUPABASE_ANON_KEY - the "anon"
#    public API key, found on that same Project Settings -> API page.

name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from categories (genuine DB activity)
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/categories?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "Status: $status"
          echo "Response body:"
          echo "$body"

          if [ "$status" == "200" ]; then
            echo "✅ Keep-alive ping succeeded - database is active."
          else
            echo "❌ Ping failed - check SUPABASE_URL / SUPABASE_ANON_KEY secrets, the categories RLS policy, or whether the project is already paused."
            exit 1
          fi
