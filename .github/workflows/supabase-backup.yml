# .github/workflows/supabase-backup.yml
#
# Scheduled database backup for the Supabase Postgres database.
# Runs pg_dump on a timer and saves the result as a downloadable
# GitHub Actions artifact - a safety net given Supabase's free tier
# includes no automated backups of its own.
#
# Also appends a timestamped success/failure line to DBbackupLog.txt
# at the repo root, and commits that change back - so there's a
# visible, permanent history of every backup attempt, not just
# ephemeral Actions run logs (which age out after retention-days).
#
# SETUP REQUIRED before this will work:
# 1. Add a repository secret named SUPABASE_DB_URL containing the
#    SESSION POOLER connection string (Project Settings -> Database ->
#    Connection string -> "Session pooler" tab), NOT the direct
#    connection - GitHub's runners don't have IPv6 connectivity, and
#    Supabase's direct connection is IPv6-only on the free tier, so
#    it will fail with "Network is unreachable". The session pooler is
#    IPv4-compatible and also keeps one stable connection for the
#    whole run, which is what pg_dump needs. Fill in the real password
#    in place of the placeholder before saving the secret.
# 2. That's it - no other setup needed, pg_dump/psql come pre-installed
#    on GitHub's ubuntu-latest runners.
#
# RESTORING a backup later (manual process, run locally, not part of
# this workflow):
#   1. Download the artifact from the Actions tab for the run you want.
#   2. Unzip it to get the backup-YYYY-MM-DD.sql file.
#   3. Restore into a FRESH, empty database first (not directly into
#      the live one) to check it looks right:
#        psql "your-fresh-database-connection-string" < backup-YYYY-MM-DD.sql
#   4. Once verified, either point the app at the restored database,
#      or selectively copy back just what's needed.

name: Supabase Database Backup

on:
  schedule:
    # Runs once a day at 03:00 UTC. Adjust the cron expression to
    # change frequency - e.g. '0 3 * * 0' for once a week instead.
    - cron: '0 3 * * *'
  # Also allows triggering a backup manually from the Actions tab,
  # without waiting for the next scheduled run.
  workflow_dispatch:

permissions:
  # Needed so this workflow can commit the updated log file back to
  # the repo - the default read-only token isn't enough to push.
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Postgres 17 client tools (must match or exceed server version)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump the database
        id: dump
        run: |
          FILENAME="backup-$(date +'%Y-%m-%d').sql"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

          if /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" --no-owner --no-privileges > "$FILENAME"; then
            SIZE=$(du -h "$FILENAME" | cut -f1)
            echo "✅ Backup succeeded - $FILENAME ($SIZE)"
            echo "result=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Backup failed - pg_dump exited with an error. Check SUPABASE_DB_URL is the SESSION POOLER string (not direct connection - direct is IPv6-only and will fail here), and that the password in it is correct and not the placeholder."
            echo "result=FAILURE" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload backup as an artifact
        if: steps.dump.outputs.result == 'SUCCESS'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup-*.sql
          # How long GitHub keeps this artifact before automatically
          # deleting it. Increase if a longer retention window is
          # wanted (check GitHub's current plan limits for the max).
          retention-days: 30

      - name: Append result to DBbackupLog.txt
        id: log
        run: |
          timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          if [ "${{ steps.dump.outputs.result }}" == "SUCCESS" ]; then
            line="$timestamp - SUCCESS - ${{ steps.dump.outputs.filename }} (${{ steps.dump.outputs.size }})"
          else
            line="$timestamp - FAILURE - backup did not complete"
          fi
          echo "$line" >> DBbackupLog.txt
          echo "Logged: $line"

      - name: Commit and push the updated log
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DBbackupLog.txt
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          elif git commit -m "Backup log: ${{ steps.dump.outputs.result }} ($(date -u +'%Y-%m-%d %H:%M UTC'))" && git push; then
            echo "✅ Log committed and pushed successfully."
          else
            echo "❌ Failed to commit/push the log file - check the workflow has 'contents: write' permission."
            exit 1
          fi

      - name: Fail the run if the backup itself failed
        if: steps.dump.outputs.result == 'FAILURE'
        run: exit 1
